# Prometheus configuration used by ops/docker-compose.ops.yml. For a Prometheus you already run, copy the scrape job from ops/prometheus-scrape.example.yml instead.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/prometheus-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: annaba-hr-api
    metrics_path: /health/metrics
    scheme: http                      # inside the compose network; the API is not exposed publicly
    authorization:
      type: Bearer
      credentials_file: /prometheus/.metrics-token
    static_configs:
      - targets: ["api:8080"]
